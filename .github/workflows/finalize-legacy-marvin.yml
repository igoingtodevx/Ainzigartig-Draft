name: Finalize Legacy Marvin UI

on:
  push:
    branches:
      - finish-marvin-design
    paths:
      - '.github/workflows/finalize-legacy-marvin.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finish-marvin-design

      - name: Finalize legacy styling and public copy
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              Path('components/KIBeratung.tsx'),
              Path('components/KIKundenservice.tsx'),
              Path('components/KIRecruiting.tsx'),
              Path('components/AnalyticsDashboard.tsx'),
          ]

          common = {
              'text-white': 'text-ink',
              'hover:border-neon-cyan': 'hover:border-accent-hover',
              'hover:border-neon-pink': 'hover:border-accent-hover',
              'hover:border-neon-yellow': 'hover:border-accent-hover',
              'from-neon-cyan via-neon-pink to-neon-yellow': 'from-accent via-accent-mid to-[#B77A36]',
              'shadow-[0_0_12px_rgba(0,255,255,0.25)]': 'shadow-soft',
              'shadow-[0_0_15px_rgba(0,255,255,0.15)]': 'shadow-soft',
              'shadow-[0_0_15px_rgba(255,0,255,0.15)]': 'shadow-soft',
              'shadow-[0_0_15px_rgba(255,255,0,0.15)]': 'shadow-soft',
              'bg-[radial-gradient(#6B46C1_1px,transparent_1px)]': 'bg-[radial-gradient(#ECA867_1px,transparent_1px)]',
              'rounded-sm': 'rounded-full',
          }

          for p in files:
              if not p.exists():
                  continue
              text = p.read_text()
              for old, new in common.items():
                  text = text.replace(old, new)
              # Restore white foreground on intentionally dark action surfaces.
              text = text.replace('bg-primary text-ink', 'bg-primary text-white')
              text = text.replace('bg-ink text-ink', 'bg-ink text-white')
              text = text.replace('bg-primary-hover text-ink', 'bg-primary-hover text-white')
              p.write_text(text)

          # Beratung: remove legal guarantees and unsupported benchmark numbers.
          p = Path('components/KIBeratung.tsx')
          text = p.read_text()
          text = text.replace('DSGVO-konform von Anfang an', 'Datenschutz von Anfang an mitgedacht')
          text = text.replace("title: 'DSGVO-Check'", "title: 'Datenschutz- & Datenfluss-Check'")
          text = text.replace(
              "text: 'Jeder Use Case wird auf datenschutzrechtliche Compliance geprüft. Sie wissen genau, was erlaubt ist – und was nicht.'",
              "text: 'Wir machen Datenflüsse, Modellanbieter und Auftragsverarbeitung transparent und berücksichtigen Ihre Datenschutzanforderungen bereits beim Lösungsdesign.'"
          )
          text = text.replace('DSGVO-Konformität ist bei uns keine Fußnote.', 'Datenschutz ist bei uns keine Fußnote.')
          text = text.replace(
              'Viele Unternehmen nutzen KI-Tools, ohne sich über die Datenverarbeitung Gedanken zu machen. Wir stellen sicher, dass Ihre KI-Strategie rechtssicher ist – mit Serverstandorten in der EU, klaren Verträgen und praxistauglichen Datenschutzlösungen.',
              'Wir betrachten Datenflüsse, Modellanbieter, Hosting, Verträge und Zugriffsrechte gemeinsam mit dem technischen Setup. So ist früh klar, welche Anforderungen vor einem produktiven Einsatz geklärt werden müssen.'
          )
          text = text.replace("result: 'Bis zu 60% weniger Bearbeitungszeit'", "result: 'Weniger manuelle Triage und Wiederholungsarbeit'")
          text = text.replace("result: '3–5x schnellere Contentproduktion'", "result: 'Schneller von der Idee zum bearbeitbaren Entwurf'")
          p.write_text(text)

          # Recruiting: qualitative claims instead of invented benchmarks.
          p = Path('components/KIRecruiting.tsx')
          text = p.read_text()
          text = text.replace(
              'KI-gestütztes CV-Screening und intelligentes Kandidaten-Matching reduzieren Ihre Zeit bis zur Einstellung um bis zu 60% – ohne dass ein Bewerber durch das Raster fällt. Ihr HR-Team entscheidet, die KI übernimmt die Vorarbeit.',
              'KI-gestütztes Screening und Kandidaten-Matching kann wiederkehrende Sichtungsarbeit strukturieren und relevante Profile schneller vergleichbar machen. Ihr HR-Team entscheidet, die KI unterstützt bei der Vorarbeit.'
          )
          text = text.replace('Nachvollziehbare Kriterien durch subjektive Ersteindrücke', 'Nachvollziehbare Kriterien statt Bauchgefühl')
          text = text.replace('DSGVO-konform – Bewerberdaten sicher verarbeitet', 'Datenschutz für Bewerberdaten mitgedacht')
          text = text.replace("{ value: '60%', label: 'schnellere Zeit bis zur Einstellung', color: 'text-[#B77A36]' }", "{ value: 'Schneller', label: 'relevante Profile vergleichbar machen', color: 'text-[#B77A36]' }")
          text = text.replace("{ value: '80%', label: 'weniger manuelle Sichtungszeit', color: 'text-accent-hover' }", "{ value: 'Weniger', label: 'wiederkehrende Sichtungsarbeit', color: 'text-accent-hover' }")
          text = text.replace("{ value: '3x', label: 'mehr Bewerbungen – gleicher Aufwand', color: 'text-accent-hover' }", "{ value: 'Mehr Fokus', label: 'für Gespräche und Entscheidungen', color: 'text-accent-hover' }")
          text = text.replace("{ value: 'Ø 11 Tage', label: 'bis zur qualifizierten Vorauswahl statt 4–6 Wochen', color: 'text-[#B77A36]' }", "{ value: 'Strukturiert', label: 'von Eingang bis Vorauswahl', color: 'text-[#B77A36]' }")
          text = text.replace(" style={{ textShadow: '0 0 10px rgba(255,255,0,0.5)' }}", '')
          p.write_text(text)

          # Customer service: strip remaining terminal ornamentation / hard visual claims.
          p = Path('components/KIKundenservice.tsx')
          text = p.read_text()
          text = text.replace("const Separator: React.FC<{ color?: string }> = ({ color = 'neon-cyan' }) => (\n  <div className={`w-full h-px bg-gradient-to-r from-transparent via-${color}/30 to-transparent`} />\n);",
                              "const Separator: React.FC<{ color?: string }> = () => (\n  <div className=\"w-full h-px bg-gradient-to-r from-transparent via-accent/35 to-transparent\" />\n);")
          p.write_text(text)
          PY

      - name: Commit finalized legacy pages
        run: |
          git rm .github/workflows/finalize-legacy-marvin.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components
          git commit -m "style: finalize legacy pages for Marvin visual system"
          git push origin HEAD:finish-marvin-design
