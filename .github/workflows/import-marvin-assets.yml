name: Import Marvin Assets

on:
  push:
    branches:
      - finish-marvin-design
    paths:
      - '.github/workflows/import-marvin-assets.yml'

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: finish-marvin-design

      - name: Copy Ainzigartig_clean media assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ainzigartig-clean
          git clone --depth 1 https://github.com/marvin-brt/Ainzigartig_clean.git /tmp/ainzigartig-clean
          mkdir -p Assets
          cp -R /tmp/ainzigartig-clean/Assets/. Assets/
          find Assets -name '.DS_Store' -delete

      - name: Commit imported media
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets
          if git diff --cached --quiet; then
            echo "Assets already up to date"
            exit 0
          fi
          git commit -m "chore: import Marvin design media assets"
          git push origin HEAD:finish-marvin-design
